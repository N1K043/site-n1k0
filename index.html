<script>
// Navigation interne
const pages = {
  "page-presentation": document.getElementById('page-presentation'),
  "page-flstudio": document.getElementById('page-flstudio'),
  "page-oneshot": document.getElementById('page-oneshot'),
  "page-youtube": document.getElementById('page-youtube'),
  "page-n1k0": document.getElementById('page-n1k0'),
};

function showPage(){
  const hash = location.hash.replace('#','') || 'page-presentation';
  Object.values(pages).forEach(s=>s.classList.remove('active'));
  if(pages[hash]) pages[hash].classList.add('active');
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  const link = document.getElementById('link-'+hash.replace('page-',''));
  if(link) link.classList.add('active');
}
window.addEventListener('hashchange', showPage);
showPage();

// Menu CIEL animé
const cielIcon = document.getElementById('ciel-icon');
const cielMenu = document.getElementById('ciel-menu');
cielIcon.addEventListener('click', ()=>{ cielMenu.classList.toggle('show'); });
window.addEventListener('click', (e)=>{
  if(!cielIcon.contains(e.target) && !cielMenu.contains(e.target)){
    cielMenu.classList.remove('show');
  }
});

// 🎯 --- TRADUCTION FR/EN COMPLÈTE ---

  "OneShot":"OneShot",

  "À propos":"About",

  // --- TITRES DES SECTIONS ---
  "Présentation CIEL":"CIEL Presentation",
  "Mes créations musicales":"My musical creations",

  "Analyse de l'univers":"World analysis",
  "Contenu spécial":"Special content",

  // --- TEXTES DES SECTIONS ---

  "Plus de vidéos, making-of musicaux, projets interactifs et éventuelles mini-séries.":
  "More videos, musical making-ofs, interactive projects and possible mini-series.",

  "Regarde la vidéo sur YouTube":"Watch the video on YouTube"
};

let lang="fr";

document.getElementById("lang-toggle").addEventListener("click", ()=>{

  lang = lang==="fr" ? "en" : "fr";
  document.getElementById("lang-toggle").textContent = lang==="fr" ? "English" : "Français";

  Object.values(pages).forEach(section=>{
    section.querySelectorAll('*').forEach(el=>{

      if(el.children.length===0){
        const txt = el.textContent.trim();

        if(lang==="en" && translations[txt]){
          el.textContent = translations[txt];

        } else if(lang==="fr"){
          for(const fr in translations){
            if(translations[fr] === txt){
              el.textContent = fr;
            }
          }
        }
      }
    });
  });

  // Traduction du menu CIEL
  const cielLinks = document.querySelectorAll('.ciel-link');
  cielLinks.forEach(l=>{
    if(lang==="en" && l.textContent==="Présentation CIEL") l.textContent="CIEL Presentation";
    if(lang==="fr" && l.textContent==="CIEL Presentation") l.textContent="Présentation CIEL";
  });

});

// Réduction cartes au scroll mobile
window.addEventListener('scroll', ()=>{
  if(window.innerWidth<=768){
    document.querySelectorAll('.card, .presentation-box').forEach(el=>{
      el.classList.toggle('small', window.scrollY>50);
    });
  }
});
</script>
